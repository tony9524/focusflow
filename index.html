<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="FocusFlow：一個能安排待辦、追蹤進度與專注計時的個人時間管理助手。"><title>FocusFlow｜個人時間管理助手</title>
<style>
:root{--ink:#243249;--muted:#77849a;--blue:#5366d8;--pale:#eef0ff;--line:#e6eaf2;--bg:#f6f8fc;--white:#fff;--green:#21876b;--red:#c85065}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a9b2ff;outline-offset:2px}.shell{max-width:1180px;margin:auto;padding:30px 24px 70px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;gap:16px}.logo{font-size:22px;font-weight:850;letter-spacing:-.7px}.logo span{display:inline-grid;place-items:center;background:var(--blue);color:white;border-radius:13px;width:37px;height:37px;margin-right:10px}.date{color:var(--muted);font-size:14px}.hero{background:linear-gradient(115deg,#4c5bc4,#8190e7);color:white;border-radius:25px;padding:32px 36px;display:flex;justify-content:space-between;gap:20px;align-items:center;box-shadow:0 15px 32px #5063c522}.hero h1{font-size:30px;margin:0 0 10px}.hero p{margin:0;color:#e8ebff;line-height:1.8}.hero .mark{font-size:72px;opacity:.85}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:17px;margin:22px 0}.stat,.panel{background:white;border:1px solid var(--line);border-radius:20px;box-shadow:0 4px 15px #26345706}.stat{padding:22px}.stat small{display:block;color:var(--muted);margin-bottom:8px}.stat strong{font-size:29px}.stat .hint{font-size:12px;color:var(--muted);margin-left:7px}.layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr);gap:20px}.panel{padding:25px;margin-bottom:20px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.section-head h2{font-size:19px;margin:0}.section-head small{color:var(--muted)}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:7px;font-size:13px;font-weight:650}.field.wide{grid-column:1/-1}.field input,.field select{border:1px solid #dce2ee;border-radius:11px;padding:12px 13px;background:white;min-width:0;color:var(--ink)}.actions{display:flex;justify-content:flex-end;margin-top:15px}.primary{background:var(--blue);color:white;border:0;border-radius:11px;padding:11px 19px;font-weight:750}.primary:hover{background:#4052bf}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}.chip{border:1px solid var(--line);border-radius:20px;background:#fff;padding:7px 13px;color:var(--muted);font-size:13px}.chip.active{background:var(--pale);color:var(--blue);border-color:#d2d8ff;font-weight:750}.task{display:flex;align-items:flex-start;gap:12px;padding:16px 0;border-bottom:1px solid #eef0f5}.task:last-child{border-bottom:0}.task input[type=checkbox]{accent-color:var(--blue);width:18px;height:18px;margin-top:3px;cursor:pointer}.task-main{flex:1;min-width:0}.task-name{font-weight:700;overflow-wrap:anywhere}.task.done .task-name{text-decoration:line-through;color:#9aa4b3}.task-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px;font-size:12px;color:var(--muted)}.pill{padding:3px 8px;background:#f1f3f9;border-radius:8px}.pill.high{background:#fff0f0;color:#bf5163}.pill.mid{background:#fff6e9;color:#ad7b32}.pill.low{background:#eaf7f1;color:#278568}.overdue{color:var(--red)}.delete{border:0;background:transparent;color:#9aa4b3;padding:4px;font-size:17px}.delete:hover{color:var(--red)}.empty{text-align:center;color:var(--muted);padding:30px 0;line-height:1.8}.progress-track{height:11px;border-radius:20px;background:#e9edf7;overflow:hidden;margin:14px 0 9px}.progress-bar{height:100%;width:0;background:linear-gradient(90deg,#6979dd,#39b5a0);transition:width .3s}.progress-label{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}.timer{text-align:center}.timer-face{width:205px;height:205px;border:10px solid #e6eaff;border-top-color:var(--blue);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:14px auto 22px}.timer-face strong{font-size:43px;letter-spacing:1px;font-variant-numeric:tabular-nums}.timer-face span{color:var(--muted);font-size:13px}.timer-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.secondary{background:#f0f2fa;color:#56627a;border:0;border-radius:11px;padding:11px 15px}.tip{color:var(--muted);font-size:12px;text-align:center;margin:16px 0 0;line-height:1.7}.toast{position:fixed;bottom:24px;right:24px;background:#253453;color:white;padding:12px 17px;border-radius:12px;box-shadow:0 8px 20px #0002;display:none;z-index:2}.footer{text-align:center;color:#9aa4b3;font-size:12px;margin-top:18px}@media(max-width:800px){.layout{grid-template-columns:1fr}.hero .mark{display:none}}@media(max-width:520px){.shell{padding:18px 14px 50px}.hero{padding:25px 21px}.hero h1{font-size:24px}.stats{gap:9px}.stat{padding:15px 12px}.stat strong{font-size:24px}.stat .hint{display:none}.panel{padding:18px}.field-grid{grid-template-columns:1fr}.field.wide{grid-column:auto}.date{font-size:11px}.logo{font-size:18px}}
</style></head><body>
<div class="shell"><header class="top"><div class="logo"><span>✦</span>FocusFlow</div><div class="date" id="today"></div></header>
<section class="hero"><div><h1>把每一天，安排得更從容。</h1><p>記下重要任務、掌握完成進度，留一段時間專心做自己想做的事。</p></div><div class="mark" aria-hidden="true">✺</div></section>
<section class="stats" aria-label="任務統計"><div class="stat"><small>全部任務</small><strong id="total">0</strong><span class="hint">項待辦</span></div><div class="stat"><small>已完成</small><strong id="completed">0</strong><span class="hint">項完成</span></div><div class="stat"><small>待完成</small><strong id="pending">0</strong><span class="hint">項進行中</span></div></section>
<div class="layout"><main><section class="panel"><div class="section-head"><h2>＋ 新增任務</h2><small>為今天訂下一個小目標</small></div><form id="taskForm"><div class="field-grid"><label class="field wide">任務名稱<input id="taskName" maxlength="80" required placeholder="例如：完成資料庫作業"></label><label class="field">截止日期<input id="taskDate" type="date" required></label><label class="field">優先順序<select id="taskPriority"><option value="high">高優先</option><option value="mid" selected>中優先</option><option value="low">低優先</option></select></label><label class="field wide">任務分類<select id="taskCategory"><option>課業</option><option>工作</option><option>生活</option><option>其他</option></select></label></div><div class="actions"><button class="primary" type="submit">新增任務 ＋</button></div></form></section>
<section class="panel"><div class="section-head"><h2>我的待辦清單</h2><small id="taskCount"></small></div><div class="filters" aria-label="篩選任務"><button class="chip active" data-filter="all">全部</button><button class="chip" data-filter="pending">待完成</button><button class="chip" data-filter="done">已完成</button><button class="chip" data-filter="high">高優先</button></div><div id="taskList" aria-live="polite"></div></section></main>
<aside><section class="panel"><div class="section-head"><h2>本日進度</h2><small>持續累積小成就</small></div><div class="progress-label"><span>任務完成率</span><strong id="progressText">0%</strong></div><div class="progress-track" role="progressbar" aria-label="任務完成率" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressTrack"><div class="progress-bar" id="progressBar"></div></div><p class="tip" id="progressTip">新增第一個任務，開始安排今天吧！</p></section>
<section class="panel timer"><div class="section-head"><h2>專注番茄鐘</h2><small>一次專心一件事</small></div><div class="filters" style="justify-content:center"><button class="chip active" data-minutes="25">專注 25 分</button><button class="chip" data-minutes="5">休息 5 分</button></div><div class="timer-face"><strong id="clock">25:00</strong><span id="timerMode">專注時間</span></div><div class="timer-actions"><button class="primary" id="startTimer">開始專注</button><button class="secondary" id="pauseTimer">暫停</button><button class="secondary" id="resetTimer">重設</button></div><p class="tip">計時結束後會出現提示，切換分頁時也會持續計時。</p></section></aside></div><div class="footer">FocusFlow · 讓規劃成為一種輕鬆的習慣 · 資料僅儲存於目前瀏覽器</div></div><div id="toast" class="toast" role="status"></div>
<script>
(()=>{'use strict';const KEY='focusflow_tasks_v1';const $=id=>document.getElementById(id);const localDate=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};$('today').textContent=new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(new Date());$('taskDate').value=localDate();let tasks=[];try{let stored=JSON.parse(localStorage.getItem(KEY)||'[]');tasks=Array.isArray(stored)?stored.filter(t=>t&&typeof t.name==='string'):[]}catch(e){tasks=[]}let filter='all';const priority={high:'高優先',mid:'中優先',low:'低優先'};const order={high:0,mid:1,low:2};const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){notify('瀏覽器無法儲存資料，請確認儲存空間設定')}};let toastTimeout;function notify(message){$('toast').textContent=message;$('toast').style.display='block';clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>$('toast').style.display='none',2600)}function el(tag,className,text){const n=document.createElement(tag);if(className)n.className=className;if(text!==undefined)n.textContent=text;return n}
function render(){const done=tasks.filter(t=>t.done).length;const percent=tasks.length?Math.round(done/tasks.length*100):0;$('total').textContent=tasks.length;$('completed').textContent=done;$('pending').textContent=tasks.length-done;$('progressText').textContent=percent+'%';$('progressBar').style.width=percent+'%';$('progressTrack').setAttribute('aria-valuenow',percent);$('progressTip').textContent=tasks.length?(percent===100?'太棒了！所有任務都完成了 🎉':`已完成 ${done} 項，還有 ${tasks.length-done} 項等著你！`):'新增第一個任務，開始安排今天吧！';let visible=tasks.filter(t=>filter==='all'||(filter==='pending'&&!t.done)||(filter==='done'&&t.done)||(filter==='high'&&t.priority==='high'));visible.sort((a,b)=>Number(a.done)-Number(b.done)||(order[a.priority]??1)-(order[b.priority]??1)||a.date.localeCompare(b.date));$('taskCount').textContent=`顯示 ${visible.length} 項`;$('taskList').replaceChildren();if(!visible.length){$('taskList').append(el('div','empty','目前沒有符合條件的任務。\n新增任務，開始規劃吧！'));return}visible.forEach(t=>{const row=el('div','task'+(t.done?' done':''));const cb=el('input');cb.type='checkbox';cb.checked=!!t.done;cb.setAttribute('aria-label','完成 '+t.name);cb.addEventListener('change',()=>{t.done=cb.checked;save();render()});const main=el('div','task-main');main.append(el('div','task-name',t.name));const meta=el('div','task-meta');meta.append(el('span','pill '+(t.priority||'mid'),priority[t.priority]||'中優先'),el('span','pill',t.category||'其他'),el('span','pill'+(!t.done&&t.date<localDate()?' overdue':''),'截止 '+t.date));main.append(meta);const del=el('button','delete','✕');del.type='button';del.title='刪除任務';del.setAttribute('aria-label','刪除 '+t.name);del.addEventListener('click',()=>{if(confirm(`確定刪除「${t.name}」嗎？`)){tasks=tasks.filter(x=>x.id!==t.id);save();render();notify('任務已刪除')}});row.append(cb,main,del);$('taskList').append(row)})}
$('taskForm').addEventListener('submit',e=>{e.preventDefault();const name=$('taskName').value.trim();if(!name){notify('請輸入任務名稱');return}tasks.push({id:Date.now()+'-'+Math.random().toString(36).slice(2),name,date:$('taskDate').value,priority:$('taskPriority').value,category:$('taskCategory').value,done:false});save();render();$('taskName').value='';$('taskName').focus();notify('已新增任務！')});document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()}));
let duration=25*60,remaining=duration,endAt=null,interval=null;function drawClock(){const s=endAt?Math.max(0,Math.ceil((endAt-Date.now())/1000)):remaining;$('clock').textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;if(endAt&&s<=0){clearInterval(interval);interval=null;endAt=null;remaining=0;notify('時間到！辛苦了，記得休息一下。');$('startTimer').textContent='重新開始';document.title='時間到！｜FocusFlow'}}function pause(){if(endAt){remaining=Math.max(0,Math.ceil((endAt-Date.now())/1000));endAt=null;clearInterval(interval);interval=null;drawClock()}}function reset(){pause();remaining=duration;drawClock();$('startTimer').textContent='開始專注';document.title='FocusFlow｜個人時間管理助手'}$('startTimer').addEventListener('click',()=>{if(endAt)return;if(remaining<=0)remaining=duration;endAt=Date.now()+remaining*1000;interval=setInterval(drawClock,250);$('startTimer').textContent='計時中';drawClock()});$('pauseTimer').addEventListener('click',()=>{pause();$('startTimer').textContent='繼續專注'});$('resetTimer').addEventListener('click',reset);document.querySelectorAll('[data-minutes]').forEach(b=>b.addEventListener('click',()=>{pause();duration=Number(b.dataset.minutes)*60;remaining=duration;$('timerMode').textContent=duration===300?'休息時間':'專注時間';document.querySelectorAll('[data-minutes]').forEach(x=>x.classList.toggle('active',x===b));reset()}));document.addEventListener('visibilitychange',drawClock);render();drawClock()})();
</script></body></html>
